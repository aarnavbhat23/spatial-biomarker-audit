name: Sampling invariants
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-geometry.txt
      - run: python -m unittest discover -s tests -v
      - run: python verify_barcode_collisions.py
      - run: python verify_joint_measurement.py
      - run: python verify_position_uncertainty.py
      - run: python study_conserved_spatial_mass.py --verify
